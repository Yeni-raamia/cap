name: "🐛 Rapport de bug · Bug report"
description: "Signaler un dysfonctionnement · Report something that isn't working"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de ne pas signaler ici les failles de sécurité — voir `SECURITY.md`.
        Please do not report security issues here — see `SECURITY.md`.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: "Que se passe-t-il ? · What happens?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction · Steps to reproduce
      placeholder: |
        1. Aller sur…
        2. Cliquer sur…
        3. Voir l'erreur…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu · Expected behavior
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environnement · Environment
      placeholder: "OS, navigateur, version de Node, mode (dev / prod / démo)"
    validations:
      required: false
